<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MainActivity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <script src="https://unpkg.com/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <style type="text/tailwindcss">

        @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);

        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
      }

      :root {
          --background: #FAFAF8;
        --foreground: #334155;
        --primary: #38bdf8;
        --primary-foreground: #0c4a6e;
        --secondary: #fb7185;
        --secondary-foreground: #ffffff;
        --muted: #f1f5f9;
        --muted-foreground: #64748b;
        --accent: #4ade80;
        --accent-foreground: #14532d;
        --destructive: #fbbf24;
        --card: #ffffff;
        --card-foreground: #1e293b;
        --popover: #ffffff;
        --popover-foreground: #1e293b;
        --border: #e2e8f0;
        --input: #ffffff;
        --ring: #4ade80;
        --chart-1: #38bdf8;
        --chart-2: #fb7185;
        --chart-3: #4ade80;
        --chart-4: #fbbf24;
        --chart-5: #c084fc;

        --font-sans: "Nunito Sans";
        --font-heading: "Nunito Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1.5rem;
      }
    </style>
</head>

<body>
    <div class="h-screen bg-background text-foreground font-sans flex flex-col overflow-hidden">
        <header class="h-16 shrink-0 w-full px-6 flex items-center justify-between border-b border-border bg-card">
            <div class="flex items-center gap-6">
                <button id="back-button"
                    class="flex items-center gap-2 text-muted-foreground hover:text-foreground transition-colors font-bold group">
                    <iconify-icon icon="solar:alt-arrow-left-bold"
                        class="text-xl group-hover:-translate-x-1 transition-transform"></iconify-icon><span>Back</span>
                </button>
                <div class="h-6 w-[1px] bg-border mx-2"></div>
                <div class="flex flex-col leading-tight">
                    <h1 class="text-sm font-bold uppercase tracking-widest text-muted-foreground">
                        Unit 2: At the Cafe
                    </h1>
                    <p class="text-base font-extrabold text-foreground truncate max-w-[200px] md:max-w-none">
                        Activity 1: Morning Coffee
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button id="btn-save"
                    class="bg-accent text-accent-foreground px-6 py-2 rounded-full font-extrabold shadow-sm hover:shadow-md hover:scale-105 active:scale-95 transition-all flex items-center gap-2">
                    <iconify-icon icon="solar:check-circle-bold" class="text-xl"></iconify-icon><span>Save</span>
                </button>
            </div>
        </header>
        <div class="flex-1 flex overflow-hidden">
            <section id="workspace-left" class="flex-1 overflow-y-auto bg-background p-6 md:p-10 space-y-12 pb-32">
                <div id="conversation-workspace"></div>
            </section>
            <aside id="sentence-bank"
                class="relative w-72 lg:w-96 bg-card border-l border-border flex flex-col overflow-hidden shadow-2xl z-20">

                <div id="sentence-bank-items" class="flex-1 overflow-y-auto p-6 space-y-3"></div>

                <button id="add-previous-sentences-btn" type="button"
                    class="absolute bottom-6 right-6 w-12 h-12 rounded-full bg-primary text-primary-foreground shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 transition-all flex items-center justify-center"
                    aria-label="Add sentences from previous activities">
                    <iconify-icon icon="solar:add-bold" class="text-2xl"></iconify-icon>
                </button>

            </aside>
        </div>
        <div class="md:hidden fixed bottom-6 right-6 flex flex-col gap-3">
            <button
                class="w-14 h-14 bg-primary text-primary-foreground rounded-full shadow-lg flex items-center justify-center">
                <iconify-icon icon="solar:letter-bold" class="text-2xl"></iconify-icon>
            </button>
        </div>
    </div>
    <script>
        const STYLE_RECORD = {
            speakerAPlacedBubble:
                "bg-primary text-primary-foreground px-6 py-3 rounded-full shadow-sm font-bold text-lg cursor-grab active:cursor-grabbing hover:scale-105 transition-transform flex items-center gap-2",

            speakerBPlacedBubble:
                "bg-secondary text-secondary-foreground px-6 py-3 rounded-full shadow-sm font-bold text-lg cursor-grab active:cursor-grabbing hover:scale-105 transition-transform flex items-center gap-2",

            newDropArea:
                "min-h-[100px] w-full max-w-3xl bg-accent/10 border-4 border-dashed border-accent rounded-[var(--radius)] p-4 flex flex-col items-center justify-center text-accent-foreground animate-pulse",

            bankBubble:
                "relative bg-white border-2 border-border p-4 rounded-[var(--radius)] shadow-sm font-bold text-sm cursor-grab active:cursor-grabbing hover:shadow-md hover:border-primary/50 transition-all active:scale-95 flex items-center gap-2 group",

            speakerAHeaderIconWrap:
                "w-8 h-8 rounded-full bg-primary flex items-center justify-center text-primary-foreground overflow-hidden",

            speakerBHeaderIconWrap:
                "w-8 h-8 rounded-full bg-secondary flex items-center justify-center text-secondary-foreground overflow-hidden",

            speakerAPlacedArea:
                "min-h-[80px] w-full max-w-3xl bg-primary/5 border-2 border-dashed border-primary/20 rounded-[var(--radius)] p-4 flex flex-wrap gap-3 items-center",

            speakerBPlacedArea:
                "min-h-[80px] w-full max-w-3xl bg-secondary/5 border-2 border-dashed border-secondary/20 rounded-[var(--radius)] p-4 flex flex-wrap gap-3 items-center"
        };

        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function pad2(value) {
            return String(value).padStart(2, "0");
        }

        function resolveAvatarPath(avatar) {
            return `../data/${avatar}`;
        }

        function getUnitNumber(unit) {
            if (unit.unitNumber) return unit.unitNumber;

            const match = (unit.heading || "").match(/Unit\s+(\d+)/i);
            return match ? Number(match[1]) : null;
        }

        function createSpeakerCreationArea(speaker, allSpeakers, workspace, lines, sentenceBank) {
            const wrapper = document.createElement("div");
            wrapper.className = "flex flex-col gap-3 group";

            const isSpeakerA = speaker.speakerIndicator === 1;
            const headerIconClass = isSpeakerA
                ? STYLE_RECORD.speakerAHeaderIconWrap
                : STYLE_RECORD.speakerBHeaderIconWrap;

            const placedAreaClass = isSpeakerA
                ? STYLE_RECORD.speakerAPlacedArea
                : STYLE_RECORD.speakerBPlacedArea;

            const placedBubbleClass = isSpeakerA
                ? STYLE_RECORD.speakerAPlacedBubble
                : STYLE_RECORD.speakerBPlacedBubble;

            const avatarHtml = speaker.avatar
                ? `<img src="${resolveAvatarPath(speaker.avatar)}" alt="${speaker.speakerName || ""}" class="w-full h-full object-cover" />`
                : `<iconify-icon icon="solar:user-bold" class="text-sm"></iconify-icon>`;

            wrapper.innerHTML = `
    <div class="flex items-center gap-3 ml-2">
      <div class="${headerIconClass}">
        ${avatarHtml}
      </div>
      <span class="text-xs font-extrabold uppercase tracking-widest text-muted-foreground">
        ${speaker.speakerLabel || "Speaker"}
      </span>
    </div>

    <div class="${STYLE_RECORD.newDropArea}" data-speaker-indicator="${speaker.speakerIndicator}" data-initialized="false">
      <iconify-icon icon="solar:add-circle-bold-duotone" class="text-4xl mb-2"></iconify-icon>
      <span class="font-bold">Drop sentence bubbles here</span>
    </div>
  `;

            const dropzone = wrapper.querySelector("[data-speaker-indicator]");

            dropzone.addEventListener("dragover", (event) => {
                event.preventDefault();
            });

            dropzone.addEventListener("drop", (event) => {
                event.preventDefault();

                const lineId = event.dataTransfer.getData("text/plain");
                if (!lineId) return;

                const sourceBubble = getSentenceBankBubble(lineId);
                if (!sourceBubble) return;

                const line = findLineById(lines, lineId);
                if (!line) return;

                const isFirstDrop = dropzone.dataset.initialized !== "true";

                if (isFirstDrop) {
                    dropzone.dataset.initialized = "true";
                    dropzone.className = placedAreaClass;
                    dropzone.innerHTML = "";
                }

                const placedBubble = createPlacedBubble(line, placedBubbleClass);
                dropzone.appendChild(placedBubble);

                updateBankUsageCounter(line.id, 1);

                if (isFirstDrop) {
                    const nextSpeaker = getNextSpeaker(allSpeakers, speaker.speakerIndicator);
                    const nextCreationArea = createSpeakerCreationArea(
                        nextSpeaker,
                        allSpeakers,
                        workspace,
                        lines,
                        sentenceBank
                    );
                    workspace.appendChild(nextCreationArea);
                }
            });

            return wrapper;
        }

        function getNextSpeaker(allSpeakers, currentSpeakerIndicator) {
            if (!allSpeakers || allSpeakers.length === 0) {
                return {
                    speakerIndicator: 1,
                    speakerLabel: "Speaker A",
                    speakerName: "",
                    avatar: ""
                };
            }

            const currentIndex = allSpeakers.findIndex(
                speaker => speaker.speakerIndicator === currentSpeakerIndicator
            );

            if (currentIndex === -1) {
                return allSpeakers[0];
            }

            const nextIndex = (currentIndex + 1) % allSpeakers.length;
            return allSpeakers[nextIndex];
        }

        function createSentenceBankBubble(line) {
            const bubble = document.createElement("div");
            bubble.className = STYLE_RECORD.bankBubble;
            bubble.setAttribute("draggable", "true");
            bubble.dataset.lineId = line.id || "";
            bubble.dataset.sentenceType = line.sentenceType || "static";
            bubble.dataset.sentenceText = line.sentenceText || "";
            bubble.dataset.usageCount = "0";

            bubble.innerHTML = `
    <span>${line.sentenceText || ""}</span>
    <div class="absolute bottom-2 right-2 min-w-5 h-5 px-1 rounded-full bg-muted text-muted-foreground text-[10px] font-extrabold flex items-center justify-center leading-none"
         data-usage-counter>
      0
    </div>
  `;

            bubble.addEventListener("dragstart", (event) => {
                event.dataTransfer.setData("text/plain", line.id || "");
            });

            return bubble;
        }

        function createPlacedBubble(line, placedBubbleClass) {
            const bubble = document.createElement("div");
            bubble.className = placedBubbleClass;
            bubble.dataset.lineId = line.id || "";
            bubble.dataset.sentenceType = line.sentenceType || "static";
            bubble.dataset.originalText = line.sentenceText || "";
            bubble.dataset.currentText = line.sentenceText || "";

            const isDynamic = line.sentenceType === "dynamic";
            const hasBlank = (line.sentenceText || "").includes("___");

            bubble.innerHTML = `
    <span class="placed-bubble-text">${line.sentenceText || ""}</span>
    ${isDynamic && hasBlank ? `
      <button type="button"
        class="ml-1 flex items-center justify-center opacity-80 hover:opacity-100"
        aria-label="Edit sentence"
        data-edit-button>
        <iconify-icon icon="solar:pen-bold" class="text-xl"></iconify-icon>
      </button>
    ` : ``}
    <button type="button"
      class="ml-1 flex items-center justify-center opacity-80 hover:opacity-100"
      aria-label="Remove sentence">
      <iconify-icon icon="solar:close-circle-bold" class="text-xl"></iconify-icon>
    </button>
  `;

            const textEl = bubble.querySelector(".placed-bubble-text");
            const editBtn = bubble.querySelector("[data-edit-button]");
            const removeBtn = bubble.querySelector('button[aria-label="Remove sentence"]');

            if (editBtn) {
                editBtn.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();

                    const originalText = bubble.dataset.originalText || "";
                    if (!originalText.includes("___")) return;

                    const input = window.prompt("Enter the missing word or phrase:", "");
                    if (input === null) return;

                    const trimmedInput = input.trim();
                    if (!trimmedInput) return;

                    const updatedText = originalText.replace("___", trimmedInput);

                    bubble.dataset.currentText = updatedText;
                    textEl.textContent = updatedText;

                    editBtn.remove();
                });
            }

            removeBtn.addEventListener("click", (event) => {
                event.preventDefault();
                event.stopPropagation();

                const parentArea = bubble.parentElement;
                bubble.remove();

                updateBankUsageCounter(line.id, -1);

                if (parentArea && parentArea.children.length === 0) {
                    resetDropzoneToEmpty(parentArea);
                }
            });

            return bubble;
        }

        function getSentenceBankBubble(lineId) {
            return document.querySelector(`#sentence-bank-items [data-line-id="${lineId}"]`);
        }

        function updateBankUsageCounter(lineId, delta) {
            const bankBubble = getSentenceBankBubble(lineId);
            if (!bankBubble) return;

            const currentCount = Number(bankBubble.dataset.usageCount || "0");
            const nextCount = Math.max(0, currentCount + delta);

            bankBubble.dataset.usageCount = String(nextCount);

            const counter = bankBubble.querySelector("[data-usage-counter]");
            if (counter) {
                counter.textContent = String(nextCount);
            }
        }

        function resetDropzoneToEmpty(dropzone) {
            dropzone.className = STYLE_RECORD.newDropArea;
            dropzone.innerHTML = `
    <iconify-icon icon="solar:add-circle-bold-duotone" class="text-4xl mb-2"></iconify-icon>
    <span class="font-bold">Drop sentence bubbles here</span>
  `;
            dropzone.dataset.initialized = "false";
        }

        function findLineById(lines, lineId) {
            return (lines || []).find(line => line.id === lineId);
        }

        async function loadMainActivity() {
            const unitSlug = getParam("unit");
            const activityId = getParam("activity");

            const backButton = document.getElementById("back-button");

            if (backButton && unitSlug) {
                backButton.addEventListener("click", () => {
                    window.location.href = `activity-selection.html?unit=${unitSlug}`;
                });
            }

            if (!unitSlug || !activityId) {
                window.location.href = "unit-selection.html";
                return;
            }

            const unitsRes = await fetch("../data/units.json", { cache: "no-store" });
            if (!unitsRes.ok) {
                throw new Error(`Failed to load ../data/units.json (${unitsRes.status})`);
            }
            const unitsData = await unitsRes.json();

            const unit = (unitsData.units || []).find(u => u.slug === unitSlug);
            if (!unit) {
                throw new Error(`Unknown unit slug: ${unitSlug}`);
            }

            const unitNumber = getUnitNumber(unit);
            if (!unitNumber) {
                throw new Error(`Could not determine unit number for ${unitSlug}`);
            }

            const unitDir = `unit${pad2(unitNumber)}`;

            const activitiesRes = await fetch(`../data/${unitDir}/activities.json`, { cache: "no-store" });
            if (!activitiesRes.ok) {
                throw new Error(`Failed to load ../data/${unitDir}/activities.json (${activitiesRes.status})`);
            }
            const activitiesData = await activitiesRes.json();

            const activityMeta = (activitiesData.activities || []).find(a => a.id === activityId);
            if (!activityMeta) {
                throw new Error(`Unknown activity id: ${activityId}`);
            }

            const activityRes = await fetch(`../data/${unitDir}/${activityId}.json`, { cache: "no-store" });
            if (!activityRes.ok) {
                throw new Error(`Failed to load ../data/${unitDir}/${activityId}.json (${activityRes.status})`);
            }
            const activityData = await activityRes.json();

            const workspace = document.getElementById("conversation-workspace");
            const sentenceBank = document.getElementById("sentence-bank-items");

            if (!workspace) {
                throw new Error("Missing #conversation-workspace");
            }

            if (!sentenceBank) {
                throw new Error("Missing #sentence-bank-items");
            }

            workspace.innerHTML = "";
            sentenceBank.innerHTML = "";

            const speakers = activityData.speakers || [];
            const lines = activityData.lines || [];

            if (speakers.length === 0) {
                throw new Error("Activity file has no speakers array entries");
            }

            const firstSpeaker = speakers[0];
            const firstCreationArea = createSpeakerCreationArea(
                firstSpeaker,
                speakers,
                workspace,
                lines,
                sentenceBank
            );
            workspace.appendChild(firstCreationArea);

            lines.forEach(line => {
                const bubble = createSentenceBankBubble(line);
                sentenceBank.appendChild(bubble);
            });

            const titleEl = document.querySelector("header p");
            if (titleEl) {
                titleEl.textContent = `${activityMeta.id}: ${activityMeta.heading}`;
            }

            const unitEl = document.querySelector("header h1");
            if (unitEl) {
                unitEl.textContent = unit.heading;
            }
        }

        function sanitizeFilePart(value) {
            return String(value || "")
                .trim()
                .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
                .replace(/\s+/g, "_");
        }

        function getConversationSummaryData() {
            const blocks = [...document.querySelectorAll("#conversation-workspace > .flex.flex-col.gap-3.group")];

            return blocks.map(block => {
                const speakerLabelEl = block.querySelector("span.text-xs");
                const bubbleEls = [...block.querySelectorAll("[data-line-id] span:first-child")];

                return {
                    speakerLabel: speakerLabelEl ? speakerLabelEl.textContent.trim() : "Speaker",
                    lines: bubbleEls.map(el => el.textContent.trim()).filter(Boolean)
                };
            }).filter(block => block.lines.length > 0);
        }

        function getActivityContext() {
            const params = new URLSearchParams(window.location.search);
            const unit = params.get("unit") || "unit";
            const activity = params.get("activity") || "activity";

            const unitHeadingEl = document.querySelector("header h1");
            const activityHeadingEl = document.querySelector("header p");

            return {
                unitSlug: unit,
                activityId: activity,
                unitHeading: unitHeadingEl ? unitHeadingEl.textContent.trim() : unit,
                activityHeading: activityHeadingEl ? activityHeadingEl.textContent.trim() : activity
            };
        }

        function buildSummaryLines(studentName, context, summaryBlocks) {
            const lines = [];

            lines.push(`Student: ${studentName}`);
            lines.push(`Unit: ${context.unitHeading}`);
            lines.push(`Activity: ${context.activityHeading}`);
            lines.push(`Saved: ${new Date().toLocaleString()}`);
            lines.push("");

            summaryBlocks.forEach(block => {
                lines.push(block.speakerLabel);
                block.lines.forEach(line => {
                    lines.push(`- ${line}`);
                });
                lines.push("");
            });

            return lines;
        }

        async function saveConversationAsPdf() {
            const studentName = window.prompt("Enter your name:");
            if (!studentName || !studentName.trim()) return;

            const cleanName = sanitizeFilePart(studentName);
            const context = getActivityContext();
            const summaryBlocks = getConversationSummaryData();

            if (summaryBlocks.length === 0) {
                alert("There is no conversation to save yet.");
                return;
            }

            const workspace = document.getElementById("conversation-workspace");
            if (!workspace) {
                alert("Could not find the conversation workspace.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: "portrait",
                unit: "mm",
                format: "a4"
            });

            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const margin = 15;
            const usableWidth = pageWidth - margin * 2;
            const usableHeight = pageHeight - margin * 2;

            // ----- Page 1: text summary
            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(16);
            pdf.text("NH5 Conversation Summary", margin, margin);

            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(11);

            const summaryLines = buildSummaryLines(cleanName, context, summaryBlocks);
            let y = margin + 10;
            const lineHeight = 6;

            summaryLines.forEach(line => {
                const wrapped = pdf.splitTextToSize(line, usableWidth);
                wrapped.forEach(wrappedLine => {
                    if (y > pageHeight - margin) {
                        pdf.addPage();
                        y = margin;
                    }
                    pdf.text(wrappedLine, margin, y);
                    y += lineHeight;
                });
            });

            // ----- Screenshot page
            const cloned = workspace.cloneNode(true);

            cloned.querySelectorAll("*").forEach(el => {
                const style = getComputedStyle(el);

                if (style.backgroundColor.includes("oklab") || style.backgroundColor.includes("oklch")) {
                    el.style.backgroundColor = "#ffffff";
                }

                if (style.color.includes("oklab") || style.color.includes("oklch")) {
                    el.style.color = "#000000";
                }

                if (style.borderColor.includes("oklab") || style.borderColor.includes("oklch")) {
                    el.style.borderColor = "#cccccc";
                }
            });

            cloned.style.position = "fixed";
            cloned.style.left = "-10000px";
            cloned.style.top = "0";
            document.body.appendChild(cloned);

            const canvas = await html2canvas(cloned, {
                backgroundColor: "#FAFAF8",
                scale: 2,
                useCORS: true
            });

            document.body.removeChild(cloned);

            const imgData = canvas.toDataURL("image/png");

            pdf.addPage();

            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(16);
            pdf.text("Conversation Screenshot", margin, margin);

            const imgWidthPx = canvas.width;
            const imgHeightPx = canvas.height;
            const imgAspect = imgHeightPx / imgWidthPx;

            const targetWidth = usableWidth;
            const targetHeight = targetWidth * imgAspect;

            let renderWidth = targetWidth;
            let renderHeight = targetHeight;

            if (renderHeight > usableHeight - 10) {
                renderHeight = usableHeight - 10;
                renderWidth = renderHeight / imgAspect;
            }

            pdf.addImage(
                imgData,
                "PNG",
                margin,
                margin + 10,
                renderWidth,
                renderHeight
            );

            const fileName = `${cleanName}_NH5_${sanitizeFilePart(context.unitSlug)}_${sanitizeFilePart(context.activityId)}.pdf`;
            pdf.save(fileName);
        }

        const saveButton = document.getElementById("btn-save");
        if (saveButton && !saveButton.dataset.boundSave) {
            saveButton.dataset.boundSave = "true";
            saveButton.addEventListener("click", saveConversationAsPdf);
        }

        loadMainActivity().catch(err => {
            console.error(err);

            const sentenceBank = document.getElementById("sentence-bank-items");
            if (sentenceBank) {
                sentenceBank.innerHTML = `
            <div class="p-4 bg-muted/50 rounded-[var(--radius)] border border-border">
            <div class="font-bold mb-1">Could not load activity</div>
            <div class="text-sm text-muted-foreground whitespace-pre-wrap">${err.message}</div>
            </div>
        `;
            }
        });
    </script>
