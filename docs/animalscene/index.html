<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Who are you?</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="activity-container">

    <!-- PLAY AREA -->
    <div class="play-area" id="playArea"></div>

    <!-- RIGHT OVERLAY: ANIMALS -->
    <div class="overlay-right" id="overlayRight"></div>

    <!-- BOTTOM OVERLAY: SCENERY -->
    <div class="overlay-bottom" id="overlayBottom">
        <div class="tool-buttons">
            <button class="tool-btn" id="resetBtn">
                <span class="material-symbols-outlined">ink_eraser</span>
                Reset
            </button>

            <button class="tool-btn" id="enlargeBtn">                
                <span class="material-symbols-outlined">zoom_out_map</span>
                Enlarge
            </button>

            <!-- Save Scene button -->
            <button class="tool-btn" id="saveBtn">
                <span class="material-symbols-outlined">save</span>
                Save
            </button>

            <!-- Load Scene button -->
            <button class="tool-btn" id="loadBtn">
                <span class="material-symbols-outlined">file_open</span>
                Load
            </button>

            <!-- NEW: hidden file input for JSON -->
            <input type="file" id="loadInput" accept="application/json" style="display:none;">
        </div>
    </div>

    <!-- HIDDEN RETURN BUTTON -->
    <button class="return-btn" id="returnBtn" style="display:none;">
        <span class="material-symbols-outlined">zoom_in_map</span> Return
    </button>

    <!-- SHOW/HIDE BUTTON -->
    <button class="reveal-btn" id="revealBtn" style="display:none;">
        <span class="material-symbols-outlined">visibility</span>Animals
    </button>

    </div>

    <script src="DragDropTouch.js"></script>
<script src="script.js"></script>
</body>
</html>
